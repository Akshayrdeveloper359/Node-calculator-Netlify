<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Node Calculator</title>
<style>
  :root { --bg:#0f172a; --panel:#1e293b; --key:#334155; --key-hover:#475569; --accent:#6366f1; --text:#f1f5f9; --muted:#94a3b8; --err:#f87171; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  .calc { width:min(340px,92vw); background:var(--panel); border-radius:20px; padding:20px; box-shadow:0 20px 50px rgba(0,0,0,.4); }
  .display { background:var(--bg); border-radius:12px; padding:14px 16px; margin-bottom:16px; text-align:right; min-height:92px; display:flex; flex-direction:column; justify-content:flex-end; }
  #expr { color:var(--muted); font-size:14px; min-height:18px; word-break:break-all; }
  #result { font-size:34px; font-weight:600; word-break:break-all; }
  #result.error { color:var(--err); font-size:18px; }
  .keys { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  button { border:0; border-radius:12px; padding:16px 0; font-size:18px; color:var(--text); background:var(--key); cursor:pointer; transition:background .12s; }
  button:hover { background:var(--key-hover); }
  button.op { background:#3b4a63; }
  button.eq { background:var(--accent); grid-column:span 2; }
  button.eq:hover { background:#818cf8; }
  button.clear { color:var(--err); }
  footer { text-align:center; color:var(--muted); font-size:12px; margin-top:14px; }
</style>
</head>
<body>
  <main class="calc">
    <div class="display">
      <div id="expr"></div>
      <div id="result">0</div>
    </div>
    <div class="keys" id="keys"></div>
    <footer>Keyboard works too. Enter = equals, Esc = clear.</footer>
  </main>

  <script src="calculator.js"></script>
  <script>
    const keys = [
      ['C','clear'],['(',''],[')',''],['÷','op','/'],
      ['7'],['8'],['9'],['×','op','*'],
      ['4'],['5'],['6'],['−','op','-'],
      ['1'],['2'],['3'],['+','op'],
      ['0'],['.'],['⌫','op','back'],['^','op'],
      ['=','eq']
    ];
    const exprEl = document.getElementById('expr');
    const resultEl = document.getElementById('result');
    const keysEl = document.getElementById('keys');
    let expr = '';

    keys.forEach(([label, cls, value]) => {
      const b = document.createElement('button');
      b.textContent = label;
      if (cls) b.className = cls;
      b.onclick = () => press(value || label);
      keysEl.appendChild(b);
    });

    function render() { exprEl.textContent = expr; }

    function press(v) {
      resultEl.classList.remove('error');
      if (v === 'C') { expr = ''; resultEl.textContent = '0'; }
      else if (v === 'back') { expr = expr.slice(0, -1); }
      else if (v === '=') {
        try {
          if (!window.Calc) throw new Error('calculator.js did not load. Keep it in the same folder as index.html.');
          const r = window.Calc.evaluate(expr);
          resultEl.textContent = Number.isInteger(r) ? r : +r.toFixed(10);
          expr = String(resultEl.textContent);
        } catch (e) {
          resultEl.textContent = e.message;
          resultEl.classList.add('error');
        }
      } else { expr += v; }
      render();
    }

    document.addEventListener('keydown', (e) => {
      if (/^[0-9+\-*/%^().]$/.test(e.key)) press(e.key);
      else if (e.key === 'Enter') { e.preventDefault(); press('='); }
      else if (e.key === 'Backspace') press('back');
      else if (e.key === 'Escape') press('C');
    });
  </script>
</body>
</html>
